[env:uno]
platform = atmelavr
board = uno
framework = arduino

; library dependencies: install via PlatformIO library manager
; If the libraries do not match, install via CLI or the Library Manager
lib_deps = 
  adafruit/Adafruit BMP280 Library @ ^2.2.0
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.4
  johnrickman/LiquidCrystal_I2C @ ^1.1.4

; If you use a specific LED Matrix library, add it here or put the library under lib/
; e.g. md_max72xx or another library
; lib_deps = neocrafts/Arduino LED Matrix Library @ ^1.0.0

; Uncomment/Change the board if you're using a different one
; For example, Nano: board = nanoatmega328
